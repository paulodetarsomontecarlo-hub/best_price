<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Entrar · Pin Verde</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<main class="login-card">
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 30 40" width="34" height="46"><path d="M15 39C15 39 2 24.5 2 14.5 2 7.1 7.8 1 15 1s13 6.1 13 13.5C28 24.5 15 39 15 39z" fill="#fff"/>
      <path d="M10.6 9.3a1 1 0 0 1 1-1h4.1a1 1 0 0 1 1 1v10.4h-6.1zM17.7 10.7l2 1.9c.3.3.5.7.5 1.1v3.6a.9.9 0 0 0 1.8 0v-4.4l-2.5-2.4z" fill="#0f4c81"/>
      <rect x="11.9" y="10" width="3.5" height="3" rx=".5" fill="#fff"/></svg>
  </div>
  <h1>Pin Verde</h1>
  <p class="sub">Preços de Diesel S-10, S-500 e Arla nos postos da rede.</p>

  <form id="loginForm" autocomplete="on" novalidate>
    <div class="field">
      <label for="doc">CPF ou CNPJ</label>
      <input id="doc" name="username" inputmode="numeric" autocomplete="username" placeholder="Somente números" maxlength="18" required>
    </div>
    <div class="field">
      <label for="pw">Senha</label>
      <div class="pw">
        <input id="pw" name="password" type="password" autocomplete="current-password" placeholder="Sua senha" required>
        <button type="button" id="eye" aria-label="Mostrar senha">👁</button>
      </div>
    </div>
    <p id="err" class="err" role="alert" hidden></p>
    <button type="submit" id="go">Entrar</button>
  </form>
  <p class="foot">Acesso restrito a clientes cadastrados.<br>Não tem acesso? Fale com o seu contato comercial.</p>
</main>

<script>
const $ = s => document.querySelector(s);

// máscara de CPF / CNPJ enquanto digita
function mask(v) {
  const d = v.replace(/\D/g, '').slice(0, 14);
  if (d.length <= 11) return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
}
$('#doc').addEventListener('input', e => { e.target.value = mask(e.target.value); });
$('#eye').onclick = () => { const p = $('#pw'); p.type = p.type === 'password' ? 'text' : 'password'; };

$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  const err = $('#err'), btn = $('#go');
  err.hidden = true;
  const doc = $('#doc').value.replace(/\D/g, '');
  if (doc.length !== 11 && doc.length !== 14) { err.textContent = 'Informe um CPF (11 dígitos) ou CNPJ (14 dígitos).'; err.hidden = false; return; }
  if (!$('#pw').value) { err.textContent = 'Informe a senha.'; err.hidden = false; return; }
  btn.disabled = true; btn.textContent = 'Entrando…';
  try {
    const r = await fetch('/api/login', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({doc, password: $('#pw').value})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Não foi possível entrar.');
    location.replace('/');
  } catch (ex) {
    err.textContent = ex.message; err.hidden = false;
    btn.disabled = false; btn.textContent = 'Entrar';
    $('#pw').select();
  }
};

// já logado? vai direto para o mapa
fetch('/api/me').then(r => { if (r.ok) location.replace('/'); });
</script>
</body>
</html>

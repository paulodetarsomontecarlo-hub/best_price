<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Best Price · Admin</title>
<style>
body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:12px;color:#1b1f24}
h2{margin:24px 0 8px;font-size:17px}
section{border:1px solid #dde2e8;border-radius:12px;padding:12px;margin-bottom:14px}
input,select,button{font:inherit;padding:9px;border:1px solid #c5ccd5;border-radius:8px;width:100%;margin:3px 0}
button{background:#0b5fff;color:#fff;border:0;font-weight:600;cursor:pointer}
button.sec{background:#e8ecef;color:#1b1f24}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
label small{color:#667}#msg{position:sticky;top:0;background:#fff;padding:6px 0;font-weight:600}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
</style></head><body>
<h1>Admin · Best Price</h1>
<input id="tok" type="password" placeholder="Token de admin">
<div id="msg"></div>

<section><h2>Clientes (acesso ao app)</h2>
<div class="g"><input id="c_doc" placeholder="CPF ou CNPJ" inputmode="numeric"><input id="c_name" placeholder="Nome / razão social"></div>
<div class="g"><input id="c_pw" placeholder="Senha (mín. 6)"><button type="button" id="c_gen" class="sec">Gerar senha</button></div>
<button id="c_save">Cadastrar cliente</button>
<div id="c_list" style="margin-top:10px"></div></section>

<section><h2>Preços</h2>
<select id="pst"></select>
<div class="g3" id="pinputs"></div>
<button id="psave">Salvar preços</button>
<div class="g"><input id="e_lat" placeholder="Latitude"><input id="e_lon" placeholder="Longitude"></div>
<button id="esave" class="sec">Salvar coordenadas do posto (⚠ = sem coordenadas, não aparece no mapa)</button>
<small>Deixe em branco para remover o preço do produto.</small></section>

<section><h2>Novo posto</h2>
<div class="g"><input id="n_name" placeholder="Nome"><input id="n_brand" placeholder="Bandeira">
<input id="n_city" placeholder="Cidade"><input id="n_uf" placeholder="UF" maxlength="2">
<input id="n_hw" placeholder="Rodovia (ex.: BR-163)"><span></span>
<input id="n_lat" placeholder="Latitude (-20.46)"><input id="n_lon" placeholder="Longitude (-54.62)"></div>
<button id="nsave">Adicionar posto</button></section>

<section><h2>Rotas</h2>
<select id="rsel"></select>
<input id="r_name" placeholder="Nome da rota (ex.: Campo Grande → Dourados)">
<input id="r_hw" placeholder="Rodovia">
<small>Marque os postos na ordem do percurso (a ordem de marcação define a linha no mapa):</small>
<div id="rstations"></div>
<button id="rsave">Salvar rota</button><button id="rdel" class="sec">Excluir rota</button></section>

<script>
const PRODUCTS=['DIESEL S-10','DIESEL S-500','ARLA'];
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
$('#tok').value=sessionStorage.getItem('adm')||'';
let stations=[],routes=[],order=[];
const msg=(t,ok=true)=>{$('#msg').textContent=t;$('#msg').style.color=ok?'#0a7a35':'#c00'};
async function call(method,path,body){
  sessionStorage.setItem('adm',$('#tok').value);
  const r=await fetch(path,{method,headers:{'Content-Type':'application/json','X-Admin-Token':$('#tok').value},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){msg(j.error||r.status,false);throw new Error(j.error)}
  return j;
}
const fmtDt=s=>s?new Date(s).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):'nunca';
async function loadClients(){
  const r=await fetch('/api/admin/clients',{headers:{'X-Admin-Token':$('#tok').value}});
  if(!r.ok)return;const cs=await r.json();
  $('#c_list').innerHTML=cs.length?`<table style="width:100%;border-collapse:collapse;font-size:13px">`+cs.map(c=>`<tr style="border-top:1px solid #e2e8f0;${c.active?'':'opacity:.5'}">
    <td style="padding:6px 4px"><b>${esc(c.name||'—')}</b><br><small>${esc(c.doc_fmt)} · último acesso: ${fmtDt(c.last_login)}</small></td>
    <td style="text-align:right;white-space:nowrap"><button class="sec" style="width:auto;padding:6px 10px" data-pw="${c.id}">Nova senha</button>
    <button class="sec" style="width:auto;padding:6px 10px" data-act="${c.id}" data-on="${c.active?0:1}">${c.active?'Desativar':'Ativar'}</button></td></tr>`).join('')+'</table>':'<small>Nenhum cliente cadastrado.</small>';
}
$('#c_gen').onclick=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';$('#c_pw').value=Array.from(crypto.getRandomValues(new Uint32Array(8)),x=>a[x%a.length]).join('')};
$('#c_save').onclick=async()=>{
  const pw=$('#c_pw').value;
  await call('POST','/api/admin/clients',{doc:$('#c_doc').value,name:$('#c_name').value,password:pw});
  msg(`Cliente cadastrado. Senha: ${pw} (anote e envie ao cliente; ela não fica visível depois)`);
  ['c_doc','c_name','c_pw'].forEach(i=>$('#'+i).value='');loadClients()};
$('#c_list').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.pw){const pw=prompt('Nova senha (mín. 6 caracteres):');if(!pw)return;
    await call('PUT','/api/admin/clients/'+b.dataset.pw,{password:pw});msg('Senha alterada (sessões encerradas)');}
  else if(b.dataset.act){await call('PUT','/api/admin/clients/'+b.dataset.act,{active:b.dataset.on==='1'});msg('Atualizado');}
  loadClients()};
async function load(){
  loadClients();
  const h={'X-Admin-Token':$('#tok').value};
  stations=await (await fetch('/api/stations?all=1',{headers:h})).json();
  routes=await (await fetch('/api/routes',{headers:h})).json();
  if(!Array.isArray(stations)){stations=[];routes=[];return}
  $('#pst').innerHTML=stations.map(s=>`<option value="${s.id}">${s.lat==null?'⚠ ':''}${esc(s.name)} — ${esc(s.city)}</option>`).join('');
  $('#pinputs').innerHTML=PRODUCTS.map((p,i)=>`<label><small>${p}</small><input inputmode="decimal" data-p="${p}" placeholder="0,00"></label>`).join('');
  fillPrices();
  $('#rsel').innerHTML='<option value="">+ Nova rota</option>'+routes.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join('');
  fillRoute();
}
function fillPrices(){
  const s=stations.find(x=>x.id==$('#pst').value);
  $('#e_lat').value=s?.lat??'';$('#e_lon').value=s?.lon??'';
  document.querySelectorAll('#pinputs input').forEach(i=>{const p=s?.prices[i.dataset.p];i.value=p?String(p.price).replace('.',','):''});
}
function fillRoute(){
  const r=routes.find(x=>x.id==$('#rsel').value);
  $('#r_name').value=r?.name||'';$('#r_hw').value=r?.highway||'';
  order=r?[...r.station_ids]:[];
  $('#rstations').innerHTML=stations.map(s=>`<label class="chk"><input type="checkbox" value="${s.id}" ${order.includes(s.id)?'checked':''}>${esc(s.name)} <small>${esc(s.city)}</small></label>`).join('');
  document.querySelectorAll('#rstations input').forEach(c=>c.onchange=()=>{
    const id=+c.value;order=c.checked?[...order.filter(x=>x!==id),id]:order.filter(x=>x!==id)});
}
$('#pst').onchange=fillPrices;$('#rsel').onchange=fillRoute;$('#tok').onchange=load;
$('#psave').onclick=async()=>{
  const prices={};document.querySelectorAll('#pinputs input').forEach(i=>prices[i.dataset.p]=i.value.trim());
  await call('PUT','/api/admin/prices',{station_id:+$('#pst').value,prices});msg('Preços salvos');load()};
$('#esave').onclick=async()=>{
  const s=stations.find(x=>x.id==$('#pst').value);
  await call('PUT','/api/admin/stations/'+s.id,{...s,lat:$('#e_lat').value,lon:$('#e_lon').value});msg('Coordenadas salvas');load()};
$('#nsave').onclick=async()=>{
  await call('POST','/api/admin/stations',{name:$('#n_name').value,brand:$('#n_brand').value,city:$('#n_city').value,uf:$('#n_uf').value.toUpperCase(),highway:$('#n_hw').value,lat:$('#n_lat').value,lon:$('#n_lon').value});
  msg('Posto criado');document.querySelectorAll('section:nth-of-type(2) input').forEach(i=>i.value='');load()};
$('#rsave').onclick=async()=>{
  const id=$('#rsel').value,b={name:$('#r_name').value,highway:$('#r_hw').value,station_ids:order};
  await call(id?'PUT':'POST','/api/admin/routes'+(id?'/'+id:''),b);msg('Rota salva');load()};
$('#rdel').onclick=async()=>{const id=$('#rsel').value;if(id&&confirm('Excluir rota?')){await call('DELETE','/api/admin/routes/'+id);msg('Rota excluída');load()}};
if($('#tok').value)load();
</script></body></html>
